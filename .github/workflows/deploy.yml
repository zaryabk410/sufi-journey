name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test backend and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend
        run: pip install -r backend/requirements.txt

      - name: Check JavaScript syntax
        run: for f in frontend/js/*.js; do node --check "$f"; done

      - name: Smoke test the API
        working-directory: backend
        run: |
          uvicorn main:app --port 8000 &
          for i in $(seq 1 20); do curl -sf localhost:8000/api/nav >/dev/null && break; sleep 1; done
          for slug in sufism ishq kainaat peer-e-kamil shikwa maikada; do
            curl -sf "localhost:8000/api/pages/$slug" | python -c "import sys,json; d=json.load(sys.stdin); assert d['chapters'] and d['film']['shots']; print('ok', d['slug'])"
          done
          curl -sf -X POST localhost:8000/api/reflections/sufism -H 'Content-Type: application/json' -d '{"name":"CI","text":"smoke test"}'
          curl -sf localhost:8000/ | grep -q "data-page=\"sufism\""

      - name: No em dashes in content
        run: "! grep -rn $'\\u2014' backend frontend"

  build:
    name: Build static site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          SUFI_API: ${{ vars.SUFI_API }}
        run: python scripts/build_static.py --out dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
      - name: Print links
        run: |
          URL="${{ steps.pages.outputs.page_url }}"
          echo "### Sufi Journey is live" >> "$GITHUB_STEP_SUMMARY"
          for p in index ishq kainaat peer-e-kamil shikwa maikada; do
            echo "- [${p}](${URL}${p}.html)" >> "$GITHUB_STEP_SUMMARY"
          done

  backend:
    name: Deploy backend (optional)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set; skipping backend deploy (site runs in static mode)."
          else
            curl -sf -X POST "$HOOK" && echo "Backend deploy triggered."
          fi
