<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasawwuf | Sufi Journey</title>
<meta name="description" content="Sufism explained visually for Gen Z">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%B4%3C/text%3E%3C/svg%3E">
</head>
<body data-page="sufism">
<nav class="topnav" aria-label="Main">
  <a class="brand" href="index.html">Sufi Journey <span lang="ur">تصوف</span></a>
  <ul id="navlinks"></ul>
</nav>

<main>
  <div id="loading" class="loading">Opening the path</div>
  <header id="hero" class="hero"></header>
  <section id="film" class="film-section" aria-label="Animated film"></section>

  <section id="journey" class="journey">
    <div class="stage-wrap">
      <div class="stage">
        <canvas id="stageCanvas" aria-hidden="true"></canvas>
        <div class="stage-caption" id="stageCaption"></div>
      </div>
    </div>
    <div class="chapters" id="chapters"></div>
  </section>
  <nav class="rail" id="rail" aria-label="Chapters"></nav>

  <section class="after" aria-labelledby="reflectTitle">
    <h2 id="reflectTitle">Leave a reflection</h2>
    <p>What did this page change in how you see things? Reflections are shared with everyone who visits.</p>
    <form id="reflectForm" class="reflect-form">
      <label class="sr" for="rName">Name</label>
      <input id="rName" maxlength="40" placeholder="Your name (optional)">
      <label class="sr" for="rText">Reflection</label>
      <textarea id="rText" maxlength="400" placeholder="One honest sentence is enough" required></textarea>
      <div><button class="btn" type="submit">Share reflection</button></div>
      <div id="formMsg" class="form-msg" role="status"></div>
    </form>
    <ul id="wall" class="wall"></ul>
    <h2 style="margin-top:4rem">Continue the journey</h2>
    <div id="next" class="next"></div>
  </section>
</main>

<div class="audiobar" role="region" aria-label="Sound">
  <button class="btn" id="ambBtn" aria-pressed="false">Play ambience</button>
  <button class="btn ghost" id="narrateAll">Narrate whole page</button>
  <button class="btn ghost" id="stopAll">Stop voice</button>
  <button class="small-btn opt-toggle" id="optToggle" aria-expanded="false">Settings</button>
  <canvas id="meter" class="meter opt" width="60" height="22" aria-hidden="true"></canvas>
  <label class="opt">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
  <label class="opt">Speed <input id="rate" type="range" min="0.6" max="1.3" step="0.05" value="0.92"></label>
  <label class="opt">Voice <select id="voice"></select></label>
  <span id="status" class="status" aria-live="polite"></span>
</div>
<div id="toast" class="toast" role="status"></div>

<script src="js/config.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/story.js"></script>
<script src="js/story2.js"></script>
<script src="js/film.js"></script>
<script src="js/app.js"></script>
</body>
</html>
